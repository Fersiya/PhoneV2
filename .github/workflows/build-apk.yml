name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "*.bat"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Подготовить свой ключ подписи (если секреты заданы)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAVE_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (со своим ключом)
        if: env.HAVE_KEY == '1'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Build debug APK (если ключ не настроен)
        if: env.HAVE_KEY != '1'
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pc-control-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Опубликовать релиз с APK (только для main)
        if: github.ref == 'refs/heads/main' && env.HAVE_KEY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          TAG="v${VER}-build${GITHUB_RUN_NUMBER}"
          cp "$APK" PCControl.apk
          gh release create "$TAG" PCControl.apk \
            --title "Пульт ПК $VER (сборка $GITHUB_RUN_NUMBER)" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
